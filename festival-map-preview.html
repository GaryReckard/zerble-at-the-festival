<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Festival map workshop</title>
<style>body{margin:0;background:#273a34;color:#fff7df;font:16px system-ui}main{max-width:600px;margin:30px;padding:20px}button{font:inherit;padding:10px;margin:5px}#map-proof{white-space:pre-wrap}body::before{content:'';position:fixed;inset:0;z-index:-1;background:repeating-linear-gradient(30deg,transparent 0 50px,#fff1 51px 52px)} </style></head><body class="game-started"><canvas id="game" aria-hidden="true" style="position:fixed;inset:0;z-index:-1;pointer-events:none"></canvas><main><h1>Festival map workshop</h1><p>The map uses the production discovery, worker, storage, and view. Drive the fixture with WASD, open with M, or select the map. Gameplay continues while expanded.</p><button id="storage-checks">Check storage</button><button id="input-checks">Check input</button><button id="transition-checks">Check transitions</button><p id="check-result" role="status"></p><button id="drive">Drive / stop</button><button id="jump">Relocate</button><button id="objective">Track unexplored stage</button><button id="reset">Reset exploration</button><pre id="map-proof" aria-live="off">Loading map…</pre></main><div id="touch-controls"><div id="stick-base"><div id="stick-knob"></div></div><button id="btn-boost" class="touch-btn">BOOST</button><button id="btn-slow" class="touch-btn">SLOW</button><button id="btn-honk" class="touch-btn">HONK</button><button id="btn-cam" class="touch-btn">CAM</button><button id="btn-music" class="touch-btn">♪</button></div><script type="module" src="./src/festivalMap/preview.js"></script></body></html>
