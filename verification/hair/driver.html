<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gary at the wheel</title><style>body{margin:0;background:#272b35;color:#eee;font:15px system-ui}header{position:absolute;top:20px;left:24px}h1{font-size:23px;margin:0 0 10px}button{font:inherit;color:#fff;background:#454755;border:1px solid #888;padding:7px 12px;border-radius:6px}#stats{font-size:13px}canvas{display:block}</style></head><body><header><h1>Gary at the wheel</h1><button id="context">Cutaway</button> <button id="view">Side</button> <button id="light">Noon</button><p id="stats"></p></header><script type="module">
import * as THREE from 'three';import {Zerble} from '../../src/zerble.js';
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));document.body.append(renderer.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color('#272b35');const cart=new Zerble();scene.add(cart.root);
const hemi=new THREE.HemisphereLight(0xdceaff,0x706451,2),sun=new THREE.DirectionalLight(0xffe7c4,3),rim=new THREE.DirectionalLight(0xb7cbff,1.2);sun.position.set(-3,5,-5);rim.position.set(3,3,4);scene.add(hemi,sun,rim);
const camera=new THREE.PerspectiveCamera(38,1,.01,100),target=new THREE.Vector3(-.55,1.95,-.80);let cutaway=true,view=0,night=false;
const original=new Map(cart.root.children.map(c=>[c,c.visible]));
function render(){for(const child of cart.root.children)child.visible=cutaway?child===cart.driver||['Front chassis deck','Front bench cushion','Front bench back','Dark gray footwell floor'].includes(child.name):original.get(child);
 const views=[[3.7,.8,-.6],[1.9,.8,-3.8],[-2.6,.9,3.1]];camera.position.copy(target).add(new THREE.Vector3(...views[view]));camera.lookAt(target);
 hemi.intensity=night?.5:2;sun.intensity=night?.18:3;rim.intensity=night?.7:1.2;renderer.render(scene,camera);document.querySelector('#stats').textContent=`${renderer.info.render.calls} draws · ${renderer.info.render.triangles.toLocaleString()} tris · actual cart, seat and driver geometry`;}
function resize(){renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();render();}addEventListener('resize',resize);
document.querySelector('#context').onclick=e=>{cutaway=!cutaway;e.target.textContent=cutaway?'Cutaway':'Full cart';render();};document.querySelector('#view').onclick=e=>{view=(view+1)%3;e.target.textContent=['Side','Front','Back'][view];render();};document.querySelector('#light').onclick=e=>{night=!night;e.target.textContent=night?'Midnight':'Noon';render();};resize();
</script></body></html>
