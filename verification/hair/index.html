<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Crowd hair comparison</title>
<style>body{margin:0;background:#252731;color:#eee;font:15px system-ui}header{position:absolute;inset:20px 24px auto}h1{font-size:22px;margin:0 0 10px}button,select{font:inherit;color:inherit;background:#454755;border:1px solid #777;border-radius:6px;padding:7px 12px}#labels{position:absolute;bottom:30px;left:6%;right:6%;display:flex;justify-content:space-around}#stats{margin:10px 0;color:#c5c5ce}canvas{display:block}</style></head>
<body><header><h1>Crowd hair · front and back</h1><button id="version">Showing revised hair</button> <button id="light">Noon</button> <select id="color" aria-label="Hair color"><option value="0x815138">Chestnut</option><option value="0x171313">Black</option><option value="0xe4cf9d">Blond</option><option value="0x854d98">Violet</option></select><p id="stats"></p></header><div id="labels"><span>Swept crop</span><span>Curls</span><span>Long waves</span><span>Ponytail</span><span>Wrapped bun</span><span>Twin braids</span></div>
<script type="module">
import * as THREE from 'three';
import {buildCrowdHair} from '../../src/crowdHair.js';
import {buildBaselineHair} from './baseline.js';
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));document.body.append(renderer.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color('#252731');
const camera=new THREE.OrthographicCamera();camera.position.set(0,1.8,-9);camera.lookAt(0,1.6,0);
const hemi=new THREE.HemisphereLight(0xdceaff,0x706451,2);scene.add(hemi);
const sun=new THREE.DirectionalLight(0xffe7c4,3);sun.position.set(-3,5,-5);scene.add(sun);
const rim=new THREE.DirectionalLight(0xb7cbff,1.3);rim.position.set(3,3,4);scene.add(rim);
const hairMat=new THREE.MeshStandardMaterial({color:0x815138,roughness:.9});
const skin=new THREE.MeshStandardMaterial({color:0xc98e68,roughness:.9,flatShading:true});
const shirt=new THREE.MeshStandardMaterial({color:0x638978,roughness:.9,flatShading:true});
const eyeMat=new THREE.MeshStandardMaterial({color:0x18151a});
const before=buildBaselineHair(),after=buildCrowdHair(),meshes=[];
for(let row=0;row<2;row++)for(let i=0;i<6;i++){
 const root=new THREE.Group();root.position.set((2.5-i)*.91,row===0?.30:-.57,0);root.rotation.y=row===0?0:Math.PI;scene.add(root);
 const head=new THREE.Mesh(new THREE.IcosahedronGeometry(.26,1),skin);head.position.y=1.65;root.add(head);
 const neck=new THREE.Mesh(new THREE.CylinderGeometry(.09,.10,.22,6),skin);neck.position.y=1.38;root.add(neck);
 const torso=new THREE.Mesh(new THREE.SphereGeometry(.30,8,4),shirt);torso.scale.set(1,.45,.6);torso.position.y=1.24;root.add(torso);
 for(const x of [-.08,.08]){const eye=new THREE.Mesh(new THREE.SphereGeometry(.025,6,4),eyeMat);eye.position.set(x,1.68,-.246);root.add(eye);}
 const nose=new THREE.Mesh(new THREE.IcosahedronGeometry(.045,0),skin);nose.position.set(0,1.65,-.245);root.add(nose);
 const hair=new THREE.Mesh(after[i],hairMat);const sy=i===0?.92:1;hair.scale.set(.98,sy,i===2?1.02:.98);hair.position.y=1.78*(1-sy);root.add(hair);meshes.push(hair);
}
let revised=true,night=false;
function render(){renderer.render(scene,camera);document.querySelector('#stats').textContent=`${revised?'Revised':'Original'} · upper row: front, lower row: back · ${renderer.info.render.calls} draws · ${renderer.info.render.triangles.toLocaleString()} triangles (including heads and shoulders)`;}
function resize(){const aspect=innerWidth/innerHeight;const width=6.1;camera.left=-width/2;camera.right=width/2;camera.top=width/aspect/2;camera.bottom=-width/aspect/2;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);render();}addEventListener('resize',resize);
document.querySelector('#version').onclick=e=>{revised=!revised;hairMat.flatShading=!revised;hairMat.needsUpdate=true;meshes.forEach((m,i)=>m.geometry=(revised?after:before)[i%6]);e.target.textContent=revised?'Showing revised hair':'Showing original hair';render();};
document.querySelector('#light').onclick=e=>{night=!night;hemi.intensity=night?.45:2;sun.intensity=night?.15:3;rim.intensity=night?.7:1.3;scene.background.set(night?'#111522':'#252731');e.target.textContent=night?'Midnight':'Noon';render();};
document.querySelector('#color').onchange=e=>{hairMat.color.setHex(Number(e.target.value));render();};resize();
</script></body></html>
