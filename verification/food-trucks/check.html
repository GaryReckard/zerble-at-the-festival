<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Food truck model checks</title>
<style>
  body { margin: 0; background: #171522; color: #f4ead7; font: 14px/1.5 ui-monospace, monospace; }
  header { padding: 12px 18px; }
  h1 { margin: 0; font: 18px/1.3 system-ui, sans-serif; }
  p { margin: 4px 0 0; color: #c9bdd4; }
  #view { display: block; width: 100%; height: min(68vh, 680px); }
  pre { margin: 0; padding: 12px 18px; max-height: 30vh; overflow: auto; white-space: pre-wrap; }
</style>
<header><h1>Food truck silhouettes</h1><p>Taco Loco · Moonbean · Pizza Pie, service side facing the camera</p></header>
<canvas id="view"></canvas>
<pre id="result">Checking actual Three.js builders…</pre>
<script type="importmap">{"imports":{"three":"../../src/threeShim.js","three-actual":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import { buildFoodTruck, FOOD_TRUCK_SCALE } from '../../src/models/foodTruck.js';

const checks = [];
function assert(value, message) {
  if (!value) throw new Error(message);
  checks.push(message);
}
function counted(value) {
  let calls = 0;
  return { rng: () => { calls++; return value; }, get calls() { return calls; } };
}
function triangleContains(px, py, a, b, c) {
  const cross = (p1, p2, x, y) => (p2.x - p1.x) * (y - p1.y) - (p2.y - p1.y) * (x - p1.x);
  const d1 = cross(a, b, px, py), d2 = cross(b, c, px, py), d3 = cross(c, a, px, py);
  return !((d1 < -1e-7 || d2 < -1e-7 || d3 < -1e-7) && (d1 > 1e-7 || d2 > 1e-7 || d3 > 1e-7));
}
function frontFaceCovers(geometry, zFace, x, y) {
  const position = geometry.attributes.position;
  for (let i = 0; i < position.count; i += 3) {
    const a = { x: position.getX(i), y: position.getY(i), z: position.getZ(i) };
    const b = { x: position.getX(i + 1), y: position.getY(i + 1), z: position.getZ(i + 1) };
    const c = { x: position.getX(i + 2), y: position.getY(i + 2), z: position.getZ(i + 2) };
    if (Math.abs(a.z - zFace) < 1e-5 && Math.abs(b.z - zFace) < 1e-5 && Math.abs(c.z - zFace) < 1e-5 && triangleContains(x, y, a, b, c)) return true;
  }
  return false;
}
function inspect(root, style, open) {
  root.updateMatrixWorld(true);
  let draws = 0, casters = 0, triangles = 0, maxRadius = 0, minY = Infinity, maxY = -Infinity;
  const geometries = new Set(), materials = new Set(), textures = new Set();
  const vertex = new THREE.Vector3(), instance = new THREE.Matrix4(), world = new THREE.Matrix4();
  let finiteWorldVertices = true;
  root.traverse((mesh) => {
    if (!mesh.isMesh) return;
    draws += Array.isArray(mesh.material) ? (mesh.geometry.groups.length || 1) : 1;
    casters += Number(mesh.castShadow);
    geometries.add(mesh.geometry);
    const mats = Array.isArray(mesh.material) ? mesh.material : [mesh.material];
    for (const material of mats) {
      materials.add(material);
      assert(material.userData.shared === true, `${style}: pooled material`);
      if (material.map) {
        textures.add(material.map);
        assert(material.map.userData.shared === true, `${style}: pooled sign texture`);
      }
    }
    assert(mesh.geometry.userData.shared === true, `${style}: pooled geometry`);
    const position = mesh.geometry.attributes.position;
    assert(Object.values(mesh.geometry.attributes).every((attribute) => attribute.array.every(Number.isFinite)), `${style}: finite geometry attributes`);
    const instances = mesh.isInstancedMesh ? mesh.count : 1;
    triangles += (mesh.geometry.index?.count ?? position.count) / 3 * instances;
    for (let n = 0; n < instances; n++) {
      if (mesh.isInstancedMesh) {
        mesh.getMatrixAt(n, instance);
        world.multiplyMatrices(mesh.matrixWorld, instance);
      } else world.copy(mesh.matrixWorld);
      for (let i = 0; i < position.count; i++) {
        vertex.set(position.getX(i), position.getY(i), position.getZ(i)).applyMatrix4(world);
        finiteWorldVertices &&= Number.isFinite(vertex.x) && Number.isFinite(vertex.y) && Number.isFinite(vertex.z);
        maxRadius = Math.max(maxRadius, Math.hypot(vertex.x, vertex.z));
        minY = Math.min(minY, vertex.y);
        maxY = Math.max(maxY, vertex.y);
      }
    }
  });
  assert(finiteWorldVertices, `${style}: finite world-space bounds`);
  assert(draws <= 30, `${style}: ${draws} actual render submissions stay within the 30-draw limit`);
  assert(casters <= 1, `${style}: at most one shadow caster`);
  assert(minY >= -0.02 && maxY <= 7.1, `${style}: scaled height stays within the legacy truck envelope`);
  assert(maxRadius <= 6.12, `${style}: radius ${maxRadius.toFixed(3)} scaled footprint stays within the existing 6.12 m collision radius`);
  const body = root.getObjectByName('food_truck_body');
  assert(body && body.geometry.userData.shared, `${style}: body shell is pooled`);
  assert(!frontFaceCovers(body.geometry, open[4], open[0], open[1]), `${style}: service opening has no solid wall across its center`);
  assert(frontFaceCovers(body.geometry, open[4], open[0] + open[2] / 2 + 0.25, open[1]), `${style}: solid wall remains beside the service opening`);
  return { draws, casters, triangles, maxRadius: Number(maxRadius.toFixed(3)), minY: Number(minY.toFixed(3)), maxY: Number(maxY.toFixed(3)), pooledGeometries: geometries.size, pooledMaterials: materials.size, pooledTextures: textures.size };
}

try {
  const renderer = new THREE.WebGLRenderer({ canvas: document.querySelector('#view'), antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.5));
  renderer.setSize(window.innerWidth, Math.min(window.innerHeight * 0.68, 680));
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.shadowMap.enabled = false;
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x302b3c);
  scene.fog = new THREE.Fog(0x302b3c, 28, 55);
  scene.add(new THREE.HemisphereLight(0xffefd4, 0x40384f, 2.1));
  const key = new THREE.DirectionalLight(0xfff4dc, 2.0);
  key.position.set(-7, 12, 9);
  scene.add(key);
  const ground = new THREE.Mesh(new THREE.PlaneGeometry(80, 45), new THREE.MeshLambertMaterial({ color: 0x635850 }));
  ground.rotation.x = -Math.PI / 2;
  ground.position.y = -0.03;
  scene.add(ground);

  const camera = new THREE.PerspectiveCamera(34, window.innerWidth / Math.min(window.innerHeight * 0.68, 680), 0.1, 100);
  camera.position.set(0, 7.2, 20);
  camera.lookAt(0, 2.1, 0);
  const examples = [
    { style: 'taco', sample: 0.03, open: [0.8, 2.35, 2.65, 0.92, 1.6], x: -8 },
    { style: 'coffee', sample: 0.41, open: [0.8, 2.5, 3.1, 0.92, 1.6], x: 0 },
    { style: 'pizza', sample: 0.81, open: [0.5, 1.95, 2.9, 0.92, 1.7], x: 8 },
  ];
  const builds = [];
  const everyVariant = [];
  const counts = { taco: 0, coffee: 0, pizza: 0 };
  const byVariantGeometry = new Map();
  for (let slot = 0; slot < 18; slot++) {
    const sample = (slot + 0.25) / 18;
    const source = counted(sample);
    const truck = buildFoodTruck(source.rng);
    assert(source.calls === 1, `variant slot ${slot}: builder consumes exactly one RNG draw`);
    const style = truck.userData.foodTruckStyle;
    counts[style]++;
    let variantDraws = 0;
    truck.traverse((mesh) => {
      if (!mesh.isMesh) return;
      variantDraws += Array.isArray(mesh.material) ? (mesh.geometry.groups.length || 1) : 1;
      assert(mesh.geometry.userData.shared === true, `variant slot ${slot}: all model geometry is pooled`);
      for (const material of (Array.isArray(mesh.material) ? mesh.material : [mesh.material])) {
        assert(material.userData.shared === true, `variant slot ${slot}: all model materials are pooled`);
        if (material.map) assert(material.map.userData.shared === true, `variant slot ${slot}: all sign textures are pooled`);
      }
    });
    assert(variantDraws <= 30, `variant slot ${slot}: ${variantDraws} render submissions stay within the 30-draw limit`);
    everyVariant.push(truck);
    assert(truck.userData.foodTruckPalette === Math.floor(slot / 3), `variant slot ${slot}: palette mapping remains bounded`);
    assert(truck.scale.x === FOOD_TRUCK_SCALE && truck.isGroup, `variant slot ${slot}: scaled Group API`);
    const body = truck.getObjectByName('food_truck_body');
    const variantKey = `${style}:${truck.userData.foodTruckPalette}`;
    if (!byVariantGeometry.has(variantKey)) byVariantGeometry.set(variantKey, body.geometry);
    else assert(byVariantGeometry.get(variantKey) === body.geometry, `${variantKey}: body geometry reused within a palette`);
    if (slot === 0) builds.push({ truck, ...examples[0] });
    if (slot === 7) builds.push({ truck, ...examples[1] });
    if (slot === 14) builds.push({ truck, ...examples[2] });
  }
  assert(counts.taco === 6 && counts.coffee === 6 && counts.pizza === 6, 'Six palette variants exist for each of three distinct styles');
  const pooledGeometry = new Set(), pooledMaterials = new Set(), pooledTextures = new Set();
  for (const truck of everyVariant) truck.traverse((mesh) => {
    if (!mesh.isMesh) return;
    pooledGeometry.add(mesh.geometry);
    for (const material of (Array.isArray(mesh.material) ? mesh.material : [mesh.material])) {
      pooledMaterials.add(material);
      if (material.map) pooledTextures.add(material.map);
    }
  });
  for (const geometry of pooledGeometry) {
    assert(Object.values(geometry.attributes).every((attribute) => attribute.array.every(Number.isFinite)), 'every pooled geometry has finite vertex attributes');
  }
  const reports = {};
  for (const build of builds) {
    reports[build.style] = inspect(build.truck, build.style, build.open);
    build.truck.position.x = build.x;
    scene.add(build.truck);
  }
  renderer.render(scene, camera);
  const result = {
    pass: true, assertions: checks.length, rngDraws: 18, variants: counts, FOOD_TRUCK_SCALE,
    sharedPools: { geometries: pooledGeometry.size, materials: pooledMaterials.size, textures: pooledTextures.size },
    reports,
  };
  document.querySelector('#result').textContent = JSON.stringify(result, null, 2);
  document.documentElement.dataset.result = 'pass';
} catch (error) {
  document.querySelector('#result').textContent = 'FAIL: ' + error.stack;
  document.documentElement.dataset.result = 'fail';
  throw error;
}
</script>
</html>
