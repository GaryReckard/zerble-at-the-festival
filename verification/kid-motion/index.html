<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kid motion, live controller</title>
<script type="importmap">{"imports":{"three":"../../src/threeShim.js","three-actual":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}</script>
<style>
  body { margin: 0; background: #172123; color: #f4f1df; font: 14px system-ui, sans-serif; }
  #panel { position: absolute; top: 12px; left: 12px; max-width: 320px; padding: 14px; background: #172123df; border: 1px solid #b6aa77; border-radius: 10px; }
  h1 { font-size: 17px; margin: 0 0 8px; }
  p { line-height: 1.45; margin: 8px 0; }
  button { margin: 4px 4px 0 0; padding: 7px 10px; cursor: pointer; }
  #error { color: #ff9c8c; white-space: pre-wrap; }
  canvas { display: block; }
</style>
<div id="panel">
  <h1>Kid motion, live controller</h1>
  <p>The colored children run through the production <code>KidGaggle.update</code>. The parked cart and three bubbles hold them in a small, repeatable scene.</p>
  <button id="bubbles">Hide bubbles</button><button id="honk">Honk</button><button id="reset">Reset positions</button>
  <p id="stats"></p><p id="error"></p>
</div>
<script type="module">
import * as THREE from 'three';
import { KidGaggle } from '../../src/obstacles.js';

try {
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x294041);
  const camera = new THREE.PerspectiveCamera(48, innerWidth / innerHeight, 0.1, 200);
  camera.position.set(0, 18, 22);
  camera.lookAt(0, 0, 0);
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
  document.body.append(renderer.domElement);
  scene.add(new THREE.HemisphereLight(0xf7efd7, 0x54727b, 2.1));
  const sun = new THREE.DirectionalLight(0xffead2, 2.2);
  sun.position.set(8, 20, 12);
  scene.add(sun);
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(80, 80), new THREE.MeshLambertMaterial({ color: 0x708c62 }));
  floor.rotation.x = -Math.PI / 2;
  scene.add(floor);
  const grid = new THREE.GridHelper(32, 16, 0x35594d, 0x55775f);
  grid.position.y = 0.015;
  scene.add(grid);

  const cart = new THREE.Mesh(new THREE.BoxGeometry(1.8, 0.8, 2.8), new THREE.MeshLambertMaterial({ color: 0xc26b3d }));
  cart.position.y = 0.55;
  scene.add(cart);
  const zerble = {
    position: new THREE.Vector3(0, 0, 0), nozzleWorld: new THREE.Vector3(0, 0, 2),
    forwardWorld: new THREE.Vector3(0, 0, -1), speed: 0,
  };
  const gaggle = new KidGaggle();
  scene.add(gaggle.group);
  const shown = gaggle.kids.slice(0, 8);
  for (const kid of gaggle.kids) kid.visible = shown.includes(kid);
  function reset() {
    shown.forEach((kid, i) => {
      const a = i / shown.length * Math.PI * 2;
      kid.position.set(Math.cos(a) * 4.5, 0, 2 + Math.sin(a) * 4.5);
      kid.userData.center.set(0, 0, 2);
      kid.userData.heading = Math.atan2(-kid.position.x, kid.position.z - 2);
      kid.userData.displayedYaw = kid.userData.heading;
      kid.userData.chaseTarget = null;
      kid.userData.scatterTimer = 0;
    });
  }
  reset();

  const bubblePositions = [new THREE.Vector3(-2, 1.35, 4), new THREE.Vector3(2, 1.5, 4), new THREE.Vector3(0, 1.2, 7)];
  const bubbleMeshes = bubblePositions.map((pos, i) => {
    const mesh = new THREE.Mesh(new THREE.SphereGeometry(0.32, 16, 12),
      new THREE.MeshPhongMaterial({ color: [0x7be9fa, 0xfaa3de, 0xffe389][i], transparent: true, opacity: 0.75, shininess: 90 }));
    mesh.position.copy(pos);
    scene.add(mesh);
    return mesh;
  });
  let bubblesOn = true;
  const bubbles = { forEachAlive(fn) { if (bubblesOn) bubblePositions.forEach((pos) => fn({ pos })); } };
  document.querySelector('#bubbles').onclick = (event) => {
    bubblesOn = !bubblesOn;
    event.target.textContent = bubblesOn ? 'Hide bubbles' : 'Show bubbles';
    bubbleMeshes.forEach((mesh) => { mesh.visible = bubblesOn; });
  };
  document.querySelector('#honk').onclick = () => gaggle.scatter(zerble);
  document.querySelector('#reset').onclick = reset;
  addEventListener('resize', () => {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  });

  let previous = performance.now();
  function frame(now) {
    const dt = Math.min((now - previous) / 1000, 0.05);
    previous = now;
    // The first two bubbles trade a few centimeters of nearest distance.
    bubblePositions[0].x = -2 + Math.sin(now * 0.002) * 0.08;
    bubblePositions[1].x = 2 + Math.sin(now * 0.002) * 0.08;
    bubbleMeshes.forEach((mesh, i) => mesh.position.copy(bubblePositions[i]));
    gaggle.update(dt, bubbles, zerble, null);
    const chasing = shown.filter((kid) => kid.userData.chaseTarget).length;
    document.querySelector('#stats').textContent = `${shown.length} visible kids · ${chasing} tracking a bubble · parked cart`;
    renderer.render(scene, camera);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
  window.__kidMotion = { scene, camera, renderer, gaggle, shown, bubblePositions, zerble, reset };
} catch (error) {
  document.querySelector('#error').textContent = error.stack || String(error);
  throw error;
}
</script>
</html>
