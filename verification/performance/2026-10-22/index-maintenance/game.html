<!doctype html><meta charset="utf-8"><title>Registry streaming check</title>
<style>body{background:#18202c;color:#eee;font:15px system-ui}iframe{width:960px;height:540px;border:0}button{padding:12px;margin:8px}pre{white-space:pre-wrap}</style>
<h1>Registry streaming check</h1><button id="run" disabled>Check streaming and collision candidates</button><iframe id="game" title="Real game"></iframe><pre id="result">Loading</pre>
<script type="module">
const frame=document.querySelector('#game'),out=document.querySelector('#result'),button=document.querySelector('#run');
const tier=new URLSearchParams(location.search).get('perf')||'low';
frame.src=`../../../../?perf=${tier}&seed=3948869160&mute=1&debug`;
const delay=ms=>new Promise(r=>setTimeout(r,ms));
const started=Date.now();const timer=setInterval(()=>{if(frame.contentWindow.__dbg){clearInterval(timer);button.disabled=false;out.textContent='Title ready';}else if(Date.now()-started>20000){clearInterval(timer);out.textContent='FAIL boot timeout';}},100);
function check(reg,x,z){
 reg.rebuildSpatialIndex();
 for(const colliders of [true,false]){
  const entries=[...reg.entries.values()];const small=entries.filter(e=>colliders?e.collider:e.footprint>0&&e.footprint<16);
  const pad=Math.max(0,...small.map(e=>colliders?e.collider.radius:e.footprint));
  for(const [dx,dz] of [[0,0],[8,8],[-8,-8],[3,-3]]){
   const cx=Math.floor((x+dx)/8),cz=Math.floor((z+dz)/8),cr=Math.ceil((3+pad)/8),expected=[];
   for(let iz=cz-cr;iz<=cz+cr;iz++)for(let ix=cx-cr;ix<=cx+cr;ix++)for(const e of small)if(Math.floor(e.position.x/8)===ix&&Math.floor(e.position.z/8)===iz)expected.push(e.id);
   if(!colliders)for(const e of entries)if(e.footprint>=16)expected.push(e.id);
   const actual=[];reg[colliders?'collidersNear':'footprintsNear'](x+dx,z+dz,3,e=>actual.push(e.id));
   if(JSON.stringify(actual)!==JSON.stringify(expected))throw new Error('Membership/order mismatch at '+[x,z]);
  }
 }
 if(reg._spatialState.size!==reg.entries.size)throw new Error('Stale spatial state');
 return {x,z,entries:reg.entries.size,snapshots:reg._spatialState.size,footprintCells:reg._fpGrid.cells.size,colliderCells:reg._colGrid.cells.size};
}
button.onclick=async()=>{
 button.disabled=true;out.textContent='Running';
 try{
  const dbg=frame.contentWindow.__dbg;dbg.start();dbg.debug.god(true);
  const steps=[];
  for(const [x,z] of [[300,-641],[463,43],[800,800],[-800,-800],[300,-641]]){
   dbg.teleport(x,z);await delay(1500);steps.push(check(dbg.game.registry,x,z));
  }
  out.textContent=JSON.stringify({tier,steps,queries:steps.length*8,passed:true},null,2);out.dataset.state='complete';
 }catch(e){out.textContent=e.stack;out.dataset.state='failed';}
 finally{button.disabled=false;}
};
</script>
