<!doctype html><meta charset="utf-8"><title>Game effect activation check</title>
<style>body{background:#18202c;color:#eee;font:15px system-ui}iframe{width:960px;height:540px;border:0}button{padding:12px;margin:8px}pre{white-space:pre-wrap}</style>
<h1>Game effect activation check</h1><button id="run" disabled>Check daylight, dusk and Trip</button><button id="noon">Show Noon</button><button id="night">Show Midnight</button><iframe id="game" title="Real game"></iframe><pre id="result">Loading game</pre>
<script type="module">
const frame=document.querySelector('#game'),out=document.querySelector('#result'),button=document.querySelector('#run');
const tier=new URLSearchParams(location.search).get('perf')||'low';
frame.src=`../../../../?perf=${tier}&seed=3948869160&mute=1&debug`;
const delay=ms=>new Promise(r=>setTimeout(r,ms));
const started=Date.now();
const timer=setInterval(()=>{
 if(frame.contentWindow.__dbg){clearInterval(timer);button.disabled=false;out.textContent='Title ready';}
 else if(Date.now()-started>20000){clearInterval(timer);out.textContent='FAIL: boot did not finish';}
},100);
document.querySelector('#noon').onclick=()=>{frame.contentWindow.__dbg.tod(.25);frame.contentWindow.__dbg.game.Trip.scrub(null);};
document.querySelector('#night').onclick=()=>{frame.contentWindow.__dbg.tod(.75);frame.contentWindow.__dbg.game.Trip.scrub(null);};
button.onclick=async()=>{
 button.disabled=true;
 try{
  const dbg=frame.contentWindow.__dbg,g=dbg.game;
  dbg.start();dbg.debug.freezeNPCs(true);dbg.camLock(315,10,-625,300,1,-641);
  const snap=phase=>({phase,programs:g.renderer.info.programs.length,preparation:g.renderer.__postprocessPreparation,
   bloom:g.bloomPass.enabled,trip:g.Trip.pass.enabled,draws:g.renderer.__sceneInfo.calls});
  dbg.tod(.25);await delay(1000);const results=[snap('day')];
  dbg.tod(.5);await delay(1000);results.push(snap('dusk'));
  g.Trip.triggerDynamic();g.Trip.scrub(1/3);await delay(1000);results.push(snap('trip'));
  if(results.some(r=>r.preparation?.status!=='ready'))throw new Error('preparation not ready');
  // Scene materials may change at night; isolate whether post-process materials
  // themselves acquire another program key after their first real activation.
  const materials=[g.bloomPass.materialHighPassFilter,...g.bloomPass.separableBlurMaterials,g.bloomPass.compositeMaterial,g.bloomPass.blendMaterial,g.Trip.pass.material];
  const variants=materials.map(m=>g.renderer.properties.get(m).programs.size);
  if(variants.some(n=>n!==1))throw new Error('effect compiled extra variants: '+JSON.stringify(variants));
  out.textContent=JSON.stringify({tier,results,effectVariants:variants},null,2);out.dataset.state='complete';
 }catch(e){out.textContent=e.stack;out.dataset.state='failed';}
 finally{button.disabled=false;}
};
</script>
