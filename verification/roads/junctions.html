<script type="module">
import * as THREE from 'three';

function build(x,z){
 dispose();center={x,z};step=0;

 for(let i=0;i<p.count;i++){p.setX(i,p.getX(i)+gx);p.setZ(i,p.getZ(i)+gz);p.setY(i,terrainHeight(p.getX(i),p.getZ(i)));}geo.computeVertexNormals();
