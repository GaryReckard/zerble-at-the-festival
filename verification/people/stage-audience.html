<!doctype html><meta charset="utf-8"><title>Stage audience activities</title>
<script type="importmap">{"imports":{"three":"../../src/threeShim.js","three-actual":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}</script>
<style>body{background:#17162a;color:#fff;font:16px system-ui}canvas{max-width:100%;height:auto}pre{white-space:pre-wrap}</style><h1>Stage audience activities</h1><pre id="result">Running…</pre><button id="noon">Noon</button> <button id="night">Midnight</button> <button id="close">Blanket close-up</button>
<script type="module">
import * as THREE from 'three';import {Crowd} from '../../src/crowd.js';import {PeopleRuntime} from '../../src/people/runtime.js';import {registry} from '../../src/registry.js';import {placeStageChairRows,placePicnicBlanket} from '../../src/chunks.js';import {queryPoint} from '../../src/worldgen/index.js';import {nearestRoad} from '../../src/worldgen/roads.js';import {terrainHeight} from '../../src/worldgen/terrain.js';
const runtime=new PeopleRuntime(),scene=new THREE.Scene(),renderer=new THREE.WebGLRenderer({antialias:false});renderer.setSize(950,600);renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.05;document.body.append(renderer.domElement);const light=new THREE.HemisphereLight(0xffffff,0x556633,3);scene.add(light);const camera=new THREE.PerspectiveCamera(42,950/600,.1,150);
try{
 let cx=0,cz=0;outer:for(let z=100;z<1200;z+=50)for(let x=100;x<1200;x+=50)if(!queryPoint(x,z).noBuild&&nearestRoad(x,z).dist>30){cx=x;cz=z;break outer;}
 const group=new THREE.Group();scene.add(group);let r=0;placeStageChairRows({group,key:'fixture',rng:()=> (++r%3===0?.9:.4)},(x,z)=>({x:x+cx,z:z+cz}),0,0,14,10,5,-18);
 const chairs=[...registry.entries.values()].filter(e=>e.kind==='chair');if(chairs.length<4)throw Error('Insufficient production chairs');const styles=new Set(chairs.map(e=>e.chairStyle));if(styles.size!==4)throw Error('Not every chair style was placed');
 for(const a of chairs)for(const b of chairs)if(a!==b&&Math.hypot(a.position.x-b.position.x,a.position.z-b.position.z)<a.footprint+b.footprint+.15)throw Error('Chair overlap');
 const crowd=new Crowd({spawn(){},spawnLost(){}},{runtime});scene.add(crowd.group);const chair=chairs[0],seat=chair.campSeats[0],person=crowd.spawnPerson({pos:new THREE.Vector3(seat.approachX,0,seat.approachZ),rng:()=>.4,allowPhotographer:false});
 const npc=crowd.npcs[0];npc.energy=.8;for(let i=0;i<100;i++){npc.stateTimer=10;crowd.camps.tick(.05,person,.3);}if(npc.state!=='camp_seated')throw Error('Stage chair not occupied');
 const x=cx,z=cz-5,y=terrainHeight(x,z);placePicnicBlanket({group,key:'fixture',rng:()=>.5},x,z,true);const entry=[...registry.entries.values()].find(e=>e.kind==='picnic');if(!entry)throw Error('Production blanket was not placed');

 for(let i=0;i<2;i++){
  const seat=entry.tableSeats[i],sitter=crowd.spawnPerson({pos:new THREE.Vector3(seat.x,seat.y,seat.z),rng:()=>.65+i*.1,allowPhotographer:false}),s=crowd.npcs.at(-1);s.energy=.8;
  if(!crowd.picnics.tryClaim(sitter))throw Error('Blanket not reserved');crowd.picnics.tickWalking(.05,sitter);if(!s.picnicCrossLegged||Math.abs(s.yaw-seat.yaw)>.001)throw Error('Blanket sitter pose or stage-facing heading wrong');
 }
 if(entry.tableSeats.filter(s=>s.occupied).length!==2)throw Error('Blanket sharing failed');

 for(let i=0;i<3;i++){const h=crowd.spawnPerson({pos:new THREE.Vector3(cx-4+i*2,terrainHeight(cx-4+i*2,cz-8),cz-8),rng:()=>.3+i*.15,allowPhotographer:false}),n=crowd.npcs.at(-1);Object.assign(n,{state:'idle',onDancefloor:true,dance:.8,bob:i*.7,cheerTimer:0,frownTimer:0});crowd._publishPerson(n);}
 crowd._publishPopulationRanges();crowd.shoppingBagMesh.visible=false;camera.position.set(cx+10,y+12,cz+12);camera.lookAt(cx,y+.5,cz-2);
 const render=n=>{light.intensity=n?.35:3;scene.background=new THREE.Color(n?0x15251b:0x91c7db);renderer.render(scene,camera);document.querySelector('#result').textContent='PASS: staggered chair groups facing the stage, all four styles, existing Crowd chair reservation, two stage-facing cross-legged blanket occupants and stage dancers.\n'+renderer.info.render.calls+' draws / '+renderer.info.render.triangles+' triangles.';};document.querySelector('#noon').onclick=()=>render(0);document.querySelector('#night').onclick=()=>render(1);document.querySelector('#close').onclick=()=>{camera.position.set(cx+1.7,y+1.5,cz-7.8);camera.lookAt(cx,y+.65,cz-5);render(0);};render(0);
}catch(e){document.querySelector('#result').textContent='FAIL '+e.stack;console.error(e);}addEventListener('pagehide',()=>{runtime.dispose();renderer.dispose();},{once:true});
</script>
