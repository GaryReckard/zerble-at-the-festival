<!doctype html><meta charset="utf-8"><title>Reported road patch</title><style>body{background:#17162a;color:white;font:16px system-ui}iframe{width:100%;height:650px}pre{white-space:pre-wrap;max-height:80px;overflow:auto}</style>
<h1>Reported road patch, seed 3248888364</h1><button id="locate">Locate report</button> <button id="shadow">Toggle road shadow reception</button><button id="sides">Inspect winding / show back faces</button><button id="far">Toggle distant road underlay</button><pre id="result">Ready</pre><iframe src="/?seed=3248888364&x=176.19&z=-674.37&heading=21.407&tod=.707&mute=1&perf=mid"></iframe>
<script>
const f=document.querySelector('iframe'),out=document.querySelector('pre');let roads=[];
document.querySelector('#locate').onclick=async()=>{try{const d=f.contentWindow.__dbg;if(!d)throw Error('Game not initialized');d.start();d.teleport(176.19,-674.37);d.tod(.707);d.camLock(180,7,-674,171,0,-665);await new Promise(r=>setTimeout(r,3000));const g=d.game;roads=[];const found=[];g.scene.updateMatrixWorld(true);g.scene.traverse(o=>{if(!o.isMesh)return;const m=o.material;if(m?.userData?.roadSurface){roads.push(o);found.push({name:o.name,vertices:o.geometry.attributes.position.count,index:o.geometry.index?.array.constructor.name,receiveShadow:o.receiveShadow});}});out.textContent=JSON.stringify({seed:f.contentWindow.__seed,cart:g.zerble.position.toArray(),camera:g.camera.position.toArray(),locked:g.chaseCam._dbgCamLocked,roads:found.length}); }catch(e){out.textContent='FAIL '+e.stack;}};
document.querySelector('#shadow').onclick=()=>{roads.forEach(o=>o.receiveShadow=!o.receiveShadow);out.textContent='Road shadow reception: '+roads[0]?.receiveShadow;};
document.querySelector('#sides').onclick=()=>{const bad=[];for(const road of roads){const p=road.geometry.attributes.position,idx=road.geometry.index;for(let i=0;i<idx.count;i+=3){const a=idx.getX(i),b=idx.getX(i+1),c=idx.getX(i+2);const y=(p.getZ(b)-p.getZ(a))*(p.getX(c)-p.getX(a))-(p.getX(b)-p.getX(a))*(p.getZ(c)-p.getZ(a));if(y< -1e-7)bad.push({a:[p.getX(a),p.getY(a),p.getZ(a)],b:[p.getX(b),p.getY(b),p.getZ(b)],c:[p.getX(c),p.getY(c),p.getZ(c)],y});}road.material.side=2;road.material.needsUpdate=true;}out.textContent='Downward triangles: '+JSON.stringify(bad);};
document.querySelector('#far').onclick=()=>{const o=f.contentWindow.__dbg.game.scene.getObjectByName('farField:road');if(o){o.material.visible=!o.material.visible;out.textContent='Distant road underlay material visible: '+o.material.visible;}else out.textContent='No underlay';};
</script>
