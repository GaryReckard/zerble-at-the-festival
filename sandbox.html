    <!-- Google tag (gtag.js) — gated to non-local hosts only. Same isLocal
         detection as index.html so dev / sandbox sessions don't pollute
         production analytics. -->
    <script>
        (function () {
            const h = location.hostname;
            const isLocal =
                h === 'localhost' ||
                h === '127.0.0.1' ||
                h === '0.0.0.0' ||
                h.endsWith('.local') ||
                /^10\./.test(h) ||
                /^192\.168\./.test(h) ||
                /^172\.(1[6-9]|2\d|3[0-1])\./.test(h) ||
                h.includes('claude-preview') ||
                h.includes('happycog');
            if (isLocal) return;
            const s = document.createElement('script');
            s.async = true;
            s.src = 'https://www.googletagmanager.com/gtag/js?id=G-CY1FNMY8H8';
            document.head.appendChild(s);
            window.dataLayer = window.dataLayer || [];
            window.gtag = function () {
                window.dataLayer.push(arguments);
            };
            window.gtag('js', new Date());
            window.gtag('config', 'G-CY1FNMY8H8');
        })();
    </script>

    <script>
        // Same import-map cache-buster pattern as index.html so edits show up
        // immediately during development. Only enabled on local hosts.
        (function () {
            const h = location.hostname;
            // Same host set as index.html — include the LAN 172.16/12 block + the
            // claude-preview/happycog forwarded hosts so preview tabs cache-bust too.
            const isLocal = h === 'localhost' || h === '127.0.0.1' || h === '0.0.0.0' ||
                h.endsWith('.local') || /^10\./.test(h) || /^192\.168\./.test(h) ||
                /^172\.(1[6-9]|2\d|3[0-1])\./.test(h) ||
                h.includes('claude-preview') || h.includes('happycog');
            const v = isLocal ? '?v=' + Date.now() : '';
            // Complete src/ + models/ lists (same as index.html) so the ?v= cache-buster
            // covers every transitive import (chunks/crowd/lakes pull in forests, perf,
            // contextLights, campsite, leafDrumCircle, tribalFigures, ...). Unused entries
            // are inert; sandbox's 'three' points straight at unpkg (no threeShim) by design.
            const mods = ['roadMaterials','people/vehiclePersonFacet','people/placeDisplay','people/smilePolicy','collisionContacts','people/campResources','people/campActivity','people/marketActivity','people/pottyActivity','people/picnicActivity','people/hammockActivity','people/seatReservations','people/groupParticipation','people/frisbeeActivity','people/frisbeeSession','people/hulaActivity','people/hulaSession','people/placeVisit','people/frisbees','people/hoopers','people/brassBand','people/puppetParade','people/formationRoute','people/wooks','people/sceneResources','people/children','people/placement','people/frameTrace','people/baseline','people/runtime','people/personHandle','people/activityClaims','people/healingArtsMotion', 'people/workshop', 'playerStats', 'passportMenu', 'terrainSurface', 'terrainDriving', 'terrainSandbox', 'campClearing', 'debugCommands', 'campJamActivity', 'campMusic', 'woodlandCamping', 'campPlanning', 'campRegistry', 'oneWheels', 'oneWheelMotion', 'monks', 'nutWagon', 'nutWagonRoute', 'main', 'world', 'zerble', 'bubbles', 'bubbleTypes', 'bubbleProgress', 'bubbleChallenges', 'specialBubbles', 'upgradesMenu', 'smiles', 'fireworks', 'crowd', 'personMotion','crowdAppearance', 'healingArtsActivity', 'chunks', 'forests',
                'mountains', 'camera', 'input', 'touch', 'hud', 'sound', 'leaderboard', 'runMode', 'scoring', 'runState',  'registry', 'rng', 'debug', 'perf', 'lakes', 'lurleen', 'trip',
                'threeShim', 'midiPlayer', 'birds', 'adaptiveQuality', 'analytics', 'contextLights', 'timeOfDay', 'spatialGrid', 'starPower', 'steering', 'settings', 'a11y', 'mergeDecor', 'boostStreaks', 'photographer', 'farField', 'perfTelemetry', 'renderSizing','preparePostprocessing', 'festivalShapes',
                'worldgen/terrain', 'worldgen/constants', 'worldgen/tuning', 'worldgen/hearts', 'worldgen/water', 'worldgen/roads', 'worldgen/density', 'worldgen/roles', 'worldgen/index', 'worldgen/selftest', 'worldgen/placement', 'worldgen/festival', 'worldgen/lint'];
            const models = ['campInstruments', 'oneWheelRider', 'canoe', 'hammock', 'tent', 'tentStage', 'foodTruck', 'bo', 'monk', 'nutWagon', 'sugarShack', 'tree', 'shrub', 'heart', 'stage', 'performer',
                'entranceArch', 'leafBanner', 'puppet', 'paradeLanterns', 'bandMember', 'parasolMarshal', 'kid', 'wook', 'bird', 'bubbleJug', 'bubbleVendor',
                'campChair', 'campsite', 'frisbeePlayer', 'hulaHooper', 'healingArts', 'leafDrumCircle', 'tribalFigures', 'portaPotty', 'picnicTable', 'infoKiosk'];
            const base = new URL('./src/', document.baseURI).href;
            const imports = {
                'three': 'https://unpkg.com/three@0.160.0/build/three.module.js',
                'three/addons/': 'https://unpkg.com/three@0.160.0/examples/jsm/',
            };
            for (const m of mods) imports[base + m + '.js'] = base + m + '.js' + v;
            for (const m of models) imports[base + 'models/' + m + '.js'] = base + 'models/' + m + '.js' + v;
            const im = document.createElement('script');
            im.type = 'importmap';
            im.textContent = JSON.stringify({imports});
            document.head.appendChild(im);
        })();
    </script>

<script type="module">
    import * as THREE from 'three';

    import {buildTree} from './src/models/tree.js';
import {buildShrub} from './src/models/shrub.js';
    import {buildEntranceArch} from './src/models/entranceArch.js';
    import {leafBannerTextures} from './src/models/leafBanner.js';

    import {buildKid, tickKid} from './src/models/kid.js';

    import {

    import {
        buildCampTent, buildCampChair, buildChiminea, buildTikiTorch, buildTorchField,

    } from './src/models/campsite.js';
    import {buildTallPine, buildOak, buildBirch, buildForestTree, describeForestTree, buildForestInstanced, treeTrunkRadiusAtWorldHeight} from './src/models/tree.js';
    import {buildBird, buildBirdFlock, BIRD_KEYS, BIRD_SPECIES} from './src/models/bird.js';
    import {buildBubbleJug} from './src/models/bubbleJug.js';
    import {buildBubbleVendor} from './src/models/bubbleVendor.js';
    import {buildPortaPotty, createPottyState, updatePortaPotty, STINK_DUR, POTTY_SPACING} from './src/models/portaPotty.js';
    import {buildPicnicTable} from './src/models/picnicTable.js';
    import {buildInfoKiosk} from './src/models/infoKiosk.js';
    import {FESTIVAL_TUNING} from './src/worldgen/tuning.js';
    import {OneWheels} from './src/oneWheels.js';
    import {buildOneWheelRider, updateOneWheelRider} from './src/models/oneWheelRider.js';
    import {HealingArtsActivity} from './src/healingArtsActivity.js';
    import {buildHealingArts, updateHealingArts} from './src/models/healingArts.js';
    import {buildLeafDrumCircle, updateLeafDrumCircle} from './src/models/leafDrumCircle.js';
    import {
        buildFireDancer, buildHandDrummer, buildFirekeeper, buildSpotter,
        updateTribalFigures,
    } from './src/models/tribalFigures.js';
    import {Bubbles} from './src/bubbles.js';
    import {BUBBLE_TYPES} from './src/bubbleTypes.js';
    import {SpecialBubbleRenderer} from './src/specialBubbles.js';
    import {Smiles} from './src/smiles.js';
    import {BoostStreaks} from './src/boostStreaks.js';
    import {Fireworks, SHELL_TYPES} from './src/fireworks.js';
    import {Crowd} from './src/crowd.js';
    import {KidGaggle} from './src/people/children.js';
    import {Wooks} from './src/people/wooks.js';
    import {PeopleWorkshop} from './src/people/workshop.js';
    import {sampleHealingArtsPreview} from './src/people/healingArtsMotion.js';
    // Trip + MIDI imports for the audition panels added at the bottom of the
    // HUD. Trip needs its post-process pass slotted into a composer, so we
    // also import EffectComposer / RenderPass / OutputPass and switch the
    // sandbox render loop from `renderer.render(scene, camera)` to a
    // composer.render() pipeline below.
    import {Trip} from './src/trip.js';
    import {MidiPlayer} from './src/midiPlayer.js';
    import {EffectComposer} from 'three/addons/postprocessing/EffectComposer.js';
    import {RenderPass} from 'three/addons/postprocessing/RenderPass.js';
    import {Pass} from 'three/addons/postprocessing/Pass.js';
    import {OutputPass} from 'three/addons/postprocessing/OutputPass.js';

    const canvas = document.getElementById('canvas');
    const renderer = new THREE.WebGLRenderer({canvas, antialias: true});
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x232040);
    // No fog in the sandbox. Fog made entity inspection harder than it helped
    // (lakes can span ~200m + the forest ring 35m beyond shore, easily
    // beyond any sensible near/far pair). TimeOfDay tolerates `scene.fog`
    // being null — see its `if (this.fog)` guard.
    scene.fog = null;

    // far=500 (was 200) so the lake entity at cam.dist=220 and player-overview
    // angles don't clip; a few hundred meters is plenty for everything in the
    // sandbox without measurably hurting depth precision.
    const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 500);

    // Lights tuned for clear entity inspection (warm key + cool fill)
    const hemi = new THREE.HemisphereLight(0xb0d8ff, 0xb09060, 0.6);
    scene.add(hemi);
    const sun = new THREE.DirectionalLight(0xfff0c0, 1.3);
    sun.position.set(8, 14, 7);
    sun.castShadow = true;
    sun.shadow.mapSize.set(2048, 2048);
    sun.shadow.camera.near = 1;
    sun.shadow.camera.far = 60;
    sun.shadow.camera.left = -20;
    sun.shadow.camera.right = 20;
    sun.shadow.camera.top = 20;
    sun.shadow.camera.bottom = -20;
    scene.add(sun);
    const ambient = new THREE.AmbientLight(0xffffff, 0.25);
    scene.add(ambient);

    // Time-of-day controller — drives sun/hemi/ambient/fog just like main.js.
    // No sky shader in the sandbox, so sky is null (TimeOfDay tolerates it).
    const tod = new TimeOfDay(scene, {startT: 0.15});
    let holdTimeOfDay=false;document.getElementById('tod-hold').addEventListener('change',event=>{holdTimeOfDay=event.target.checked;});
    tod.attach({sky: null, sun, hemi, ambient});

    // Post-processing chain so the sandbox can drive the Trip ShaderPass.
    // Order: RenderPass → Trip.pass → OutputPass. The Trip panel below can
    // FIRE / DYNAMIC TRIP / COME DOWN so model behavior can be auditioned
    // under the same psychedelic effect that the game runs. Trip.pass is
    // disabled (zero envelope) until something fires it, so cost is one
    // skipped pass and an OutputPass at idle.
    Trip.init();
    const composer = new EffectComposer(renderer);
    composer.addPass(new RenderPass(scene, camera));
    // Later fullscreen passes replace renderer.info, so capture model cost here.
    const sceneInfo = {calls: 0, triangles: 0};
    class InfoCapturePass extends Pass {
        constructor() {
            super();
            this.needsSwap = false;
        }

        render(r) {
            sceneInfo.calls = r.info.render.calls;
            sceneInfo.triangles = r.info.render.triangles;
        }
    }
    composer.addPass(new InfoCapturePass());
    renderer.__sceneInfo = sceneInfo;
    composer.addPass(Trip.pass);
    composer.addPass(new OutputPass());

    // Ground reference (flat grass disc) — toggle with L
    const groundGroup = new THREE.Group();
    {
        const ground = new THREE.Mesh(
            new THREE.CircleGeometry(35, 48),
            new THREE.MeshStandardMaterial({color: 0x7cb37a, roughness: 0.95, flatShading: true}),
        );
        ground.rotation.x = -Math.PI / 2;
        ground.receiveShadow = true;
        groundGroup.add(ground);
        // Subtle grid so motion is readable
        const grid = new THREE.GridHelper(30, 30, 0x4a8048, 0x4a8048);
        grid.position.y = 0.01;
        grid.material.opacity = 0.3;
        grid.material.transparent = true;
        groundGroup.add(grid);
    }
    scene.add(groundGroup);

    // Orbit camera (no OrbitControls dep — hand-rolled, works on touch + mouse)
    const cam = {yaw: -0.4, pitch: 0.45, dist: 10, target: new THREE.Vector3(0, 1.6, 0)};

    function applyCam() {
        const cp = Math.cos(cam.pitch);
        camera.position.set(
            cam.target.x + Math.sin(cam.yaw) * cp * cam.dist,
            cam.target.y + Math.sin(cam.pitch) * cam.dist,
            cam.target.z + Math.cos(cam.yaw) * cp * cam.dist,
        );
        camera.lookAt(cam.target);
    }

    applyCam();

    function resize() {
        const w = window.innerWidth, h = window.innerHeight;
        renderer.setSize(w, h);
        composer.setSize(w, h);
        camera.aspect = w / h;
        camera.updateProjectionMatrix();
    }

    resize();
    window.addEventListener('resize', resize);

    // Input — pointer-based, works for mouse + touch
    let dragging = false, lastX = 0, lastY = 0, panning = false;
    canvas.addEventListener('pointerdown', (e) => {
        dragging = true;
        panning = e.shiftKey || e.button === 1;
        lastX = e.clientX;
        lastY = e.clientY;
        canvas.setPointerCapture(e.pointerId);
    });
    canvas.addEventListener('pointermove', (e) => {
        if (!dragging) return;
        const dx = e.clientX - lastX, dy = e.clientY - lastY;
        lastX = e.clientX;
        lastY = e.clientY;
        if (panning) {
            const panScale = cam.dist * 0.0025;
            // Pan in camera-relative axes
            const right = new THREE.Vector3();
            camera.getWorldDirection(right);
            right.cross(new THREE.Vector3(0, 1, 0)).normalize();
            const up = new THREE.Vector3(0, 1, 0);
            cam.target.addScaledVector(right, -dx * panScale).addScaledVector(up, dy * panScale);
        } else {
            cam.yaw -= dx * 0.008;
            cam.pitch = Math.max(-1.3, Math.min(1.4, cam.pitch + dy * 0.008));
        }
        applyCam();
    });
    canvas.addEventListener('pointerup', () => {
        dragging = false;
        panning = false;
    });
    canvas.addEventListener('wheel', (e) => {
        cam.dist = Math.max(2, Math.min(50, cam.dist * (1 + e.deltaY * 0.001)));
        applyCam();
        e.preventDefault();
    }, {passive: false});

    // Keyboard snaps + toggles
    const snaps = {
        '1': {yaw: 0, pitch: 0.15},         // front
        '2': {yaw: Math.PI / 2, pitch: 0.15},  // right
        '3': {yaw: Math.PI, pitch: 0.15},   // back
        '4': {yaw: -Math.PI / 2, pitch: 0.15}, // left
        '5': {yaw: -0.5, pitch: 0.9},       // top-iso
        '6': {yaw: -0.5, pitch: 0.45},      // 3/4
    };
    window.addEventListener('keydown', (e) => {
        if (snaps[e.key]) {
            cam.yaw = snaps[e.key].yaw;
            cam.pitch = snaps[e.key].pitch;
            applyCam();
        } else if (e.key === 'r' || e.key === 'R') {
            cam.yaw = -0.4;
            cam.pitch = 0.45;
            cam.dist = 10;
            cam.target.set(0, 1.6, 0);
            applyCam();
        } else if (e.key === 'l' || e.key === 'L') {
            groundGroup.visible = !groundGroup.visible;
        } else if (e.key === 'h' || e.key === 'H') {
            const hud = document.getElementById('hud');
            hud.hidden = !hud.hidden;
        }
    });

    // ----- Entity management -----
    let currentEntity = null;
    let entityRoot = null;
    let updateFn = null;
    let puppetControls = null;
    // Track the current entity's music handle (if any) so we can stop + free
    // it when switching entities. Sandbox attaches the appropriate style
    // ('jam', 'brass', 'drum', 'forest_drum') per entity in loadEntity.
    let entityMusic = null;
    const select = document.getElementById('entity');
    const info = document.getElementById('info');
    const renderStats = document.getElementById('render-stats');
    // Expose for debugging / verification. `cam` + `applyCam` let an agent frame
    // a precise close-up via preview_eval (set cam.target / yaw / pitch / dist,
    // then call applyCam()) — applyCam only runs on input otherwise.
    window.__sandbox = {
        scene, camera, cam, applyCam, renderer, loadEntity, tod,
        get entityRoot() { return entityRoot; }, get currentEntity() {
            return currentEntity;
        }, Trip, get midi() {
            return midiPlayer;
        }, Sound, get songStates() {
            return Sound.songStates ? Sound.songStates() : [];
        }
    };

    // Sound needs a user gesture to construct its AudioContext. Hook the
    // first interactive event on the sandbox so subsequent entity loads can
    // play music + SFX. Idempotent — only initialises once.
    let soundInitialised = false;

    function ensureSoundInit() {
        if (soundInitialised) return;
        soundInitialised = true;
        Sound.init();
        // Sync the volume readouts now that the gain nodes actually exist.
        updateVolumeReadouts();
    }

    for (const ev of ['pointerdown', 'keydown']) {
        window.addEventListener(ev, ensureSoundInit, {once: true});
    }

    function clearEntity() {
        groundGroup.scale.setScalar(1);
        groundGroup.position.set(0,0,0);
        entityRoot?.userData?.cleanup?.();
        puppetControls?.remove();
        puppetControls = null;
        if (currentEntity instanceof MonkParty) currentEntity.dispose();
        currentEntity?.previewParty?.dispose();
        if (currentEntity instanceof NutWagon) currentEntity.despawn();
        if (currentEntity instanceof Smiles) currentEntity.dispose();
        if (currentEntity instanceof Crowd) currentEntity.smiles.dispose();
        if (currentEntity instanceof SpecialBubbleRenderer) currentEntity.dispose();
        if (currentEntity instanceof Bubbles) currentEntity._specialRenderer.dispose();
        // Aggressive cleanup — remove every non-light, non-ground object so
        // entities that add multiple top-level roots (e.g. Lurleen's heart
        // group + her cart root) all get torn down on switch.
        for (let i = scene.children.length - 1; i >= 0; i--) {
            const c = scene.children[i];
            if (c.isLight || c === groundGroup) continue;
            scene.remove(c);
            c.traverse?.((o) => {
                if (o.isInstancedMesh) o.dispose?.();
                if (o.geometry && !o.geometry.userData?.shared) o.geometry.dispose?.();
                if (o.material) {
                    const materials = Array.isArray(o.material) ? o.material : [o.material];
                    for (const material of materials) {
                        if (!material.userData?.shared) material.dispose?.();
                    }
                }
            });
        }
        // Stop the previous entity's spatial music. detachStageMusic tears
        // down the oscillators + intervals + panner connections.
        if (entityMusic) {
            try {
                Sound.detachStageMusic(entityMusic);
            } catch (e) {
            }
            entityMusic = null;
        }
        // Remove any entity-specific DOM nodes (e.g. the cheer_demo button).
        if (currentEntity && currentEntity._sandboxCheerBtn) {
            currentEntity._sandboxCheerBtn.remove();
        }
        if (currentEntity && currentEntity._sandboxAppearanceButton) {
            currentEntity._sandboxAppearanceButton.remove();
        }
        if (currentEntity && currentEntity._sandboxPhotographerBtn) {
            currentEntity._sandboxPhotographerBtn.remove();
        }
        if (currentEntity && currentEntity._sandboxPhotographerFlashBtn) {
            currentEntity._sandboxPhotographerFlashBtn.remove();
        }
        if (window.__sandbox) {
            window.__sandbox.fireCheer = undefined;
            window.__sandbox.triggerPhotographer = undefined;
            window.__sandbox.previewPhotographerFlash = undefined;
        }
        currentEntity = null;
        entityRoot = null;
        updateFn = null;
        // Clear the star-power buff uniform so the rainbow doesn't bleed into
        // the next entity, and hide any FX meshes the demo left mid-flight.
        STAR_UNIFORMS.env.value = 0;
        if (window.__spInit) StarPower._hideFx();
    }

    function attachEntityMusic(name) {
        const style = ENTITY_MUSIC_STYLE[name];
        if (!style || !soundInitialised) return;
        // Seed varies by name so two sandbox loads of the same entity sound
        // identical, but different entities sound different.
        let seed = 0;
        for (let i = 0; i < name.length; i++) seed = (seed * 31 + name.charCodeAt(i)) | 0;

            case 'picnic_blanket': {
                // Inline replica of the picnic-blanket prop scattered in
                // chunks.js:buildOpenLawn — a 2.6m colored fabric square. The
                // game's open-lawn theme registers these as crowd attractors
                // (kind: 'picnic'); the sandbox version is purely visual.
                const g = new THREE.Group();
                const colors = [0xff6f9c, 0xffd28a, 0x6fcf6a, 0x66d9ff, 0xb285ff, 0xff8a5b];
                const blanket = new THREE.Mesh(
                    new THREE.PlaneGeometry(2.6, 2.6),

                        color: colors[Math.floor(Math.random() * colors.length)],
                        roughness: 0.9,

                blanket.rotation.z = Math.random() * Math.PI * 2;
                blanket.position.y = 0.06;
                blanket.receiveShadow = true;
                g.add(blanket);
                scene.add(g);
                entityRoot = g;
                cam.target.set(0, 0.5, 0);
                cam.dist = 6;
                applyCam();
                break;
            }
            case 'lamppost_pair': {
                // Inline replica of placePolePair() in chunks.js — two 6m poles
                // 8m apart with a slack catenary cable between them and 6
                // colored festoon bulbs hung from the cable. This is the
                // signature LEAF lighting look (and the most-hit collider on
                // open lawns at night), so worth previewable.
                const g = new THREE.Group();
                const poleMat = new THREE.MeshStandardMaterial({
                    color: 0x2a1f3a, roughness: 0.7, flatShading: true,
                });
                const h = 6;
                const ax = -4, az = 0, bx = 4, bz = 0;   // 8m apart along X
                for (const [px, pz] of [[ax, az], [bx, bz]]) {
                    const pole = new THREE.Mesh(
                        new THREE.CylinderGeometry(0.12, 0.15, h, 8),
                        poleMat,
                    );
                    pole.position.set(px, h / 2, pz);
                    pole.castShadow = true;
                    g.add(pole);
                }
                // Catenary cable — quadratic curve with a sag proportional to span.
                const startTop = new THREE.Vector3(ax, h - 0.1, az);
                const endTop = new THREE.Vector3(bx, h - 0.1, bz);
                const mid = startTop.clone().add(endTop).multiplyScalar(0.5);
                mid.y -= 0.6 + startTop.distanceTo(endTop) * 0.02;
                const curve = new THREE.QuadraticBezierCurve3(startTop, mid, endTop);
                const cable = new THREE.Mesh(
                    new THREE.TubeGeometry(curve, 12, 0.03, 4, false),
                    new THREE.MeshStandardMaterial({color: 0x1a1a1a}),
                );
                g.add(cable);

                // Bulbs strung along the cable.
                const bulbHues = [0xffd28a, 0xff6f9c, 0x8ecae6, 0x6fcf6a, 0xc77dff, 0xffd166];
                const bulbGeo = new THREE.SphereGeometry(0.12, 8, 6);
                const count = 6;
                for (let i = 0; i < count; i++) {
                    const t = (i + 0.5) / count;
                    const p = curve.getPoint(t);
                    const hue = bulbHues[i % bulbHues.length];
                    const bulb = new THREE.Mesh(
                        bulbGeo,
                        new THREE.MeshStandardMaterial({
                            color: hue, emissive: hue, emissiveIntensity: 1.2,
                        }),
                    );
                    bulb.position.copy(p);
                    bulb.position.y -= 0.13;
                    g.add(bulb);
                }
                scene.add(g);
                entityRoot = g;
                cam.target.set(0, 3, 0);
                cam.dist = 14;
                applyCam();
                break;

            case 'chunk_drum_circle': {
                // Inline replica of the simple chunk-theme drum_circle (see
                // chunks.js:buildDrumCircle). Distinct from the LEAF drum
                // circle entity — no benches, no firekeeper, just a small
                // emissive fire + stones + a single djembe. This is what
                // appears in `drum_circle` themed chunks throughout the
                // world.
                const g = new THREE.Group();
                // Fire core (emissive icosahedron).
                const fire = new THREE.Mesh(
                    new THREE.IcosahedronGeometry(0.6, 1),
                    new THREE.MeshStandardMaterial({
                        color: 0xff7733, emissive: 0xff5511,
                        emissiveIntensity: 2.5, roughness: 0.8,
                    }),
                );
                fire.position.set(0, 0.6, 0);
                g.add(fire);
                // Stone ring.
                for (let i = 0; i < 8; i++) {
                    const ang = (i / 8) * Math.PI * 2;
                    const sx = Math.cos(ang) * 1.4;
                    const sz = Math.sin(ang) * 1.4;
                    const stone = new THREE.Mesh(
                        new THREE.IcosahedronGeometry(0.3 + Math.random() * 0.15, 0),
                        new THREE.MeshStandardMaterial({
                            color: 0x6a6a78, roughness: 1, flatShading: true,
                        }),
                    );
                    stone.position.set(sx, 0.3, sz);
                    g.add(stone);
                }
                // Standalone djembe.
                const drum = new THREE.Mesh(
                    new THREE.CylinderGeometry(0.7, 0.55, 1.4, 14),
                    new THREE.MeshStandardMaterial({
                        color: 0x8b5a2b, roughness: 0.9, flatShading: true,
                    }),
                );
                drum.position.set(3, 0.7, 1);
                drum.castShadow = true;
                g.add(drum);
                scene.add(g);
                entityRoot = g;
                // Gentle fire flicker so the entity isn't statically lit in
                // preview — mimics the world's `forestAnimatables` pulse on
                // chunk firepits.
                const fireMat = fire.material;
                updateFn = (dt) => {
                    const t = performance.now() * 0.003;
                    fireMat.emissiveIntensity = 2.2 + Math.sin(t * 4) * 0.4 + Math.sin(t * 7.2) * 0.2;
                };
                cam.target.set(0, 1, 0);
                cam.dist = 8;
                applyCam();
                break;
            }
            case 'smile_face': {
                const smiles = new Smiles();
                smiles.spawn(new THREE.Vector3(0, 0, 0));
                scene.add(smiles.group);
                entityRoot = smiles.group;
                currentEntity = smiles;
                cam.target.set(0, 1.6, 0);
                cam.yaw = 0;
                cam.pitch = 0;
                cam.dist = 2;
                applyCam();
                break;
            }
            case 'smile_pickup': {
                // Live Smiles instance with a fake "Zerble" target far above
                // origin so the smiles rise and home toward a fixed point
                // without ever being collected — the preview shows the full
                // rise-then-seek motion. Re-spawn each smile a few seconds
                // after it expires so the inspection never goes empty.
                const smiles = new Smiles();
                scene.add(smiles.group);
                entityRoot = smiles.group;
                currentEntity = smiles;
                // Fake homing target ~4m above origin. Smiles rise, then home
                // toward this point; once they reach the pickup radius the
                // onCollect callback fires (a no-op here) and the smile
                // despawns. The spawn loop below drips a fresh one in every
                // ~1.2s so the field is never empty.
                const fakeZerble = {position: new THREE.Vector3(0, 4, 0)};
                // Spawn one immediately at a random ground spot, then keep
                // dripping a new one every ~1.2s so the field is never empty.
                const spawnOne = () => {
                    const ang = Math.random() * Math.PI * 2;
                    const r = 1 + Math.random() * 3;
                    smiles.spawn(new THREE.Vector3(Math.cos(ang) * r, 0, Math.sin(ang) * r));
                };
                spawnOne();
                let spawnAcc = 0;
                updateFn = (dt) => {
                    spawnAcc += dt;
                    if (spawnAcc > 1.2) {
                        spawnAcc = 0;
                        spawnOne();
                    }
                    smiles.update(dt, fakeZerble, () => { /* no-op: spawn loop refills */
                    });
                };
                cam.target.set(0, 2, 0);
                cam.dist = 8;
                applyCam();
                break;
            }
            case 'bubbles': {
                // Live Bubbles instance with a fake stationary "Zerble" that
                // has the minimum surface the system needs: a position,
                // speed (drives spawn rate), a nozzleWorld emission point,
                // and a forwardWorld direction. Bubbles spew out the back
                // and waft upward + outward; the preview shows the full
                // personality mix (follower / wanderer / spinner / sprinter)
                // and pop-on-life-end behavior.
                const bubbles = new Bubbles();
                scene.add(bubbles.mesh);
                entityRoot = bubbles.mesh;
                currentEntity = bubbles;
                const fakeZerble = {
                    position: new THREE.Vector3(0, 0, 0),
                    speed: 4,   // moderate spawn rate (full at 8 m/s)
                    nozzleWorld: new THREE.Vector3(0, 1.6, 0.6),
                    forwardWorld: new THREE.Vector3(0, 0, 1),  // bubbles launch in -forwardWorld = -Z
                };
                updateFn = (dt) => {
                    bubbles.update(dt, fakeZerble, tod.nightness);
                };
                cam.target.set(0, 2, 0);
                cam.dist = 8;
                applyCam();
                break;
            }
            case 'bubbles_special': {
                const requestedType = new URLSearchParams(location.search).get('type');
                const selectedType = BUBBLE_TYPES.find((type) => type.id === requestedType);
                const stillView = selectedType && new URLSearchParams(location.search).get('view') === 'still';
                const focusHeart = !selectedType && new URLSearchParams(location.search).get('focus') === 'heart';
                const fakeZerble = {
                    position: new THREE.Vector3(0, 0, 0),
                    speed: 8,
                    nozzleWorld: new THREE.Vector3(0, 1.6, 0.6),
                    forwardWorld: new THREE.Vector3(0, 0, 1),
                };
                const panel = document.createElement('div');
                panel.style.cssText = 'display:flex;gap:5px;margin-top:6px';
                const control = (label, action) => {
                    const button = document.createElement('button');
                    button.textContent = label;
                    button.style.cssText = 'flex:1;min-height:34px;font:inherit;color:inherit;background:rgba(255,246,230,.1);border:1px solid rgba(255,246,230,.25);border-radius:4px;cursor:pointer';
                    button.addEventListener('click', action);
                    panel.append(button);
                };
                const closeView = () => {
                    cam.target.set(focusHeart ? -6 : 0, 2, selectedType ? -1 : 0);
                    cam.yaw = 0.25;
                    cam.pitch = 0.18;
                    cam.dist = focusHeart || stillView ? 3 : (selectedType ? 6 : 20);
                    applyCam();
                };
                control('Close', closeView);
                control('Chase distance', () => {
                    cam.target.set(0, 1.6, selectedType ? -0.5 : 0);
                    cam.yaw = Math.PI;
                    cam.pitch = Math.atan2(6.5, 12);
                    cam.dist = Math.hypot(12, 6.5);
                    applyCam();
                });
                info.after(panel);
                puppetControls = panel;
                if (stillView) {
                    const specials = new SpecialBubbleRenderer();
                    const typeIndex = BUBBLE_TYPES.indexOf(selectedType);
                    const position = new THREE.Vector3(0, 2, 0);
                    scene.add(specials.root);
                    entityRoot = specials.root;
                    currentEntity = specials;
                    updateFn = (dt) => {
                        specials.beginFrame(camera, tod.nightness, dt);
                        specials.write(typeIndex, position, 2.5, 0, 0, 0.3);
                        specials.endFrame(dt);
                    };
                    info.textContent = `Loaded: ${selectedType.name} · still look preview`;
                } else if (selectedType) {
                    const bubbles = new Bubbles();
                    bubbles.setProgress({isEnabled: (id) => id === selectedType.id});
                    bubbles.forceSpecial(selectedType.id);
                    scene.add(bubbles.mesh, bubbles.specialRoot);
                    entityRoot = bubbles.specialRoot;
                    currentEntity = bubbles;
                    control('Unlock burst', () => bubbles.unlockBurst(selectedType.id));
                    updateFn = (dt) => bubbles.update(dt, fakeZerble, tod.nightness, camera);
                    info.textContent = `Loaded: ${selectedType.name} · real special emitter`;
                } else {
                    const specials = new SpecialBubbleRenderer();
                    scene.add(specials.root);
                    entityRoot = specials.root;
                    currentEntity = specials;
                    const positions = BUBBLE_TYPES.map((_, index) => new THREE.Vector3((index - 5) * 1.2, 2, 0));
                    const standard = new Bubbles();
                    standard._specialRenderer.dispose();
                    standard._dropletMesh.visible = false;
                    standard._writeInstance(0, new THREE.Vector3(-7.2, 2, 0), 2, 0);
                    standard._writeInstance(1, new THREE.Vector3(7.2, 2, 0), 2, 0);
                    standard.mesh.count = 2;
                    standard.mesh.visible = true;
                    standard.mesh.instanceMatrix.needsUpdate = true;
                    scene.add(standard.mesh);
                    control('Pop all', () => {
                        for (let i = 0; i < positions.length; i++) specials.pop(i, positions[i], 2);
                    });
                    if (focusHeart) control('Pop Heart', () => specials.pop(0, positions[0], 2));
                    updateFn = (dt) => {
                        specials.beginFrame(camera, tod.nightness, dt);
                        for (let i = 0; i < positions.length; i++) {
                            specials.write(i, positions[i], 2, 0, 0, i / positions.length);
                        }
                        specials.endFrame(dt);
                    };
                    info.textContent = 'Loaded: all bubble upgrades · standard bubbles at both ends';
                }
                closeView();
                break;
            }
            case 'boost_streaks': {
                const z = new Zerble();
                scene.add(z.root);
                const streaks = new BoostStreaks();
                scene.add(streaks.mesh);
                entityRoot = z.root;
                currentEntity = {z, streaks};
                let pathX = 8;
                let inspectAcc = 0;
                updateFn = (dt) => {
                    // Drive right-to-left at a visible, honest preview speed so
                    // the wake remains in the open canvas instead of passing
                    // beneath the sandbox control panel.
                    // The old tiny orbit moved at ~1.3m/s while reporting 23m/s,
                    // which stacked every ring inside the cart, and its heading
                    // faced exactly opposite the path.
                    pathX -= dt * 8;
                    if (pathX < -8) {
                        pathX = 8;
                        streaks.clear();
                    }
                    z.position.set(pathX, 0, 0);
                    z.heading = Math.PI / 2;
                    z.root.rotation.y = z.heading;
                    z.speed = 23;
                    z.isBoosting = true;
                    streaks.update(dt, z);
                    inspectAcc += dt;
                    if (inspectAcc >= 0.25) {
                        inspectAcc = 0;
                        let active = 0;
                        for (let i = 0; i < streaks._active.length; i++) {
                            active += streaks._active[i];
                        }
                        info.textContent = `Loaded: boost_streaks · ${active}/8 gold wake rings active behind the right-to-left cart`;
                    }
                };
                cam.target.set(0, 1.3, 0);
                // Rear three-quarter framing shows both the ring silhouettes
                // and the world-space gaps between them.
                cam.yaw = 0.95;
                cam.pitch = 0.28;
                cam.dist = 15;
                applyCam();
                break;
            }
            case 'fireworks': {
                // Live Fireworks system. We bypass its night-gated director and
                // launch shells ourselves, cycling through every SHELL_TYPE in
                // order (~1.6s apart) so each pattern is visible in turn. Passing
                // nightness 0 to update() keeps the built-in director quiet; the
                // sky is darkened via the ToD preset so the additive sparks pop.
                const fw = new Fireworks();
                scene.add(fw.group);
                entityRoot = fw.group;
                currentEntity = fw;
                tod.setT(0.78);   // deep night so the bursts read
                // Burst each shell type in place at a fixed point right in front
                // of the camera (burstAt skips the rocket) so the PATTERN is what
                // you inspect — the full rocket→burst rise is verified in-game.
                const burstPt = new THREE.Vector3(0, 22, 0);
                let cycle = 0, acc = 0.6;
                updateFn = (dt) => {
                    acc -= dt;
                    if (acc <= 0) {
                        fw.burstAt(burstPt, SHELL_TYPES[cycle % SHELL_TYPES.length]);
                        cycle++;
                        acc = 2.2;
                    }
                    fw.update(dt, 0, burstPt);
                };
                cam.target.set(0, 22, 0);
                cam.dist = 60;
                cam.pitch = 0.18;
                applyCam();
                break;
            }
        }
        attachEntityMusic(name);
        updateHitButton(name);
        if (name === 'boost_streaks') {
            info.textContent = 'Loaded: boost_streaks · gold wake rings should trail behind the right-to-left cart';
        } else if (name === 'frisbee_player') {
            info.textContent = 'Loaded: frisbee_player · both arms should hang naturally';
        } else if (name === 'frisbee_player_catch') {
            info.textContent = 'Loaded: frisbee_player_catch · one arm reaches up, forward, and outward';
        } else if (name === 'frisbee_player_throw') {
            info.textContent = 'Loaded: frisbee_player_throw · watch the 90° elbow windup straighten through release';
        } else if (name === 'frisbee_pair') {
            info.textContent = 'Loaded: frisbee_pair · the disc follows the throwing hand before each release';
        } else {
            info.textContent = `Loaded: ${name}`;
        }
    }

    {
        const slider = document.getElementById('tod-slider');

        const updateReadout = () => {

    // ---- Music + MIDI panel wiring ----
    // The four style buttons attach a stage-music engine at world origin —
    // distinct from the per-entity auto-attach so you can audition a music
    // style independent of the loaded entity. "Stop music" tears down any
    // attached engine (auto or manual). MIDI button lazy-loads Tone.js on
    // first press; subsequent presses toggle play/stop. State badge in the
    // panel header reflects which style is playing.
    let manualMusic = null;
    const musicStateEl = document.getElementById('music-state');

    function updateMusicState(text) {
        musicStateEl.textContent = text || '—';
    }

    for (const btn of document.querySelectorAll('.music-btn')) {
        btn.addEventListener('click', () => {
            ensureSoundInit();
            // Stop any prior manual or auto engine before attaching a fresh one.
            if (manualMusic) {
                try {
                    Sound.detachStageMusic(manualMusic);
                } catch (e) {
                }
                manualMusic = null;
            }
            if (entityMusic) {
                try {
                    Sound.detachStageMusic(entityMusic);
                } catch (e) {
                }
                entityMusic = null;
            }
            const style = btn.dataset.style;
            // Seed by style name so two clicks of "Jam" produce the same pattern.
            let seed = 0;
            for (let i = 0; i < style.length; i++) seed = (seed * 31 + style.charCodeAt(i)) | 0;
            manualMusic = Sound.attachStageMusic(0, 1.5, 0, seed, style);
            updateMusicState(style);
        });
    }
    document.getElementById('music-stop').addEventListener('click', () => {
        if (manualMusic) {
            try {
                Sound.detachStageMusic(manualMusic);
            } catch (e) {
            }
            manualMusic = null;
        }
        if (entityMusic) {
            try {
                Sound.detachStageMusic(entityMusic);
            } catch (e) {
            }
            entityMusic = null;
        }
        updateMusicState('—');
    });

    // Song-state readout — polls Sound.songStates() ~4 times per second.
    // Shows live section, tempo, key, and phase for each running songform engine.
    const songStateEl = document.getElementById('song-state-readout');
    setInterval(() => {
        const states = Sound.songStates ? Sound.songStates() : [];
        if (!states || states.length === 0) {
            songStateEl.textContent = '—';
            return;
        }
        songStateEl.textContent = states.map(s =>
            `[${s.genre}] song#${s.songIdx} ${s.tempo}bpm key×${s.keyShift} ${s.tonicHz}Hz\n` +
            `  sec:${s.section} bar:${s.barInSection} beat:${s.beatInSong}/${s.totalBeats} ${s.phase}`
        ).join('\n');
    }, 250);

    // MIDI player — same code path as the in-game M key. Lazy-loads Tone.js
    // + @tonejs/midi on first press. The MidiPlayer reads Trip.progress()
    // each frame to warp its effect chain, so firing a trip from the panel
    // below WILL audibly affect the MIDI playback if both are running.
    const midiPlayer = new MidiPlayer();
    const midiBtn = document.getElementById('midi-toggle');
    // Stub HUD so MidiPlayer.toggle's toast calls don't throw. Pipes its
    // status messages into the entity info panel's text field.
    const midiHud = {
        toast: (msg) => {
            info.textContent = msg;
        }
    };
    midiBtn.addEventListener('click', async () => {
        ensureSoundInit();
        await midiPlayer.toggle(midiHud);
        midiBtn.textContent = midiPlayer.isPlaying ? '■ MIDI' : '♪ MIDI';
    });

    // Trip-envelope sweep slider — drives both MIDI effect chain and
    // procedural music trip warp directly, bypassing the wook flow.
    const tripSweepSlider = document.getElementById('trip-sweep');
    const tripSweepReadout = document.getElementById('trip-sweep-r');
    tripSweepSlider.addEventListener('input', () => {
        const v = parseFloat(tripSweepSlider.value);
        tripSweepReadout.textContent = v.toFixed(2);
        if (midiPlayer && midiPlayer.isPlaying) {
            midiPlayer.setTripState(v, v);
        }
        Sound.setMusicTrip(v, v);
    });

    // ---- Trip panel wiring ----
    // Sliders are built from EFFECT_KEYS (mirroring debug.js); each writes
    // to Trip.config[key] on input. Preset buttons call Trip.setPreset() and
    // we sync the slider values back to whatever the preset set. FIRE uses
    // Static mode (slider config), DYNAMIC uses the scripted timeline (the
    // wook-flow experience). COME DOWN smoothly fades out from the current
    // envelope. State readout updates each frame from Trip._envelope etc.
    const tripBody = document.getElementById('trip-body');
    const tripToggleBtn = document.getElementById('trip-toggle');
    const tripStateEl = document.getElementById('trip-state');
    const tripSlidersHost = document.getElementById('trip-sliders');
    const tripSliders = {};
    const TRIP_EFFECT_KEYS = [
        ['hueShift', 'Hue'],
        ['saturation', 'Sat'],
        ['uvRipple', 'Ripple'],
        ['chromaticAberration', 'Chroma'],
        ['lensDistortion', 'Lens'],
        ['posterize', 'Poster'],
        ['vignettePulse', 'Vign'],
        ['brightnessPulse', 'Bright'],
    ];
    for (const [key, label] of TRIP_EFFECT_KEYS) {
        const row = document.createElement('div');
        row.style.cssText = 'display:flex;align-items:center;gap:4px;margin-bottom:2px';
        const lbl = document.createElement('span');
        lbl.textContent = label;
        lbl.style.cssText = 'flex:0 0 42px;font-size:10px;opacity:0.8';
        const input = document.createElement('input');
        input.type = 'range';
        input.min = 0;
        input.max = 1;
        input.step = 0.01;
        input.value = Trip.config[key];
        input.style.cssText = 'flex:1;accent-color:#c8a0ff;cursor:pointer';
        const readout = document.createElement('span');
        readout.textContent = Trip.config[key].toFixed(2);
        readout.style.cssText = 'width:30px;text-align:right;font-size:10px';
        input.addEventListener('input', () => {
            const v = parseFloat(input.value);
            Trip.config[key] = v;
            readout.textContent = v.toFixed(2);
        });
        row.append(lbl, input, readout);
        tripSlidersHost.appendChild(row);
        tripSliders[key] = {input, readout};
    }

    function syncTripSlidersFromConfig() {
        for (const [key, s] of Object.entries(tripSliders)) {
            s.input.value = Trip.config[key];
            s.readout.textContent = Trip.config[key].toFixed(2);
        }
    }

    for (const btn of document.querySelectorAll('.trip-preset')) {
        btn.addEventListener('click', () => {
            Trip.setPreset(btn.dataset.preset);
            syncTripSlidersFromConfig();
        });
    }
    document.getElementById('trip-fire').addEventListener('click', () => Trip.trigger());
    document.getElementById('trip-dynamic').addEventListener('click', () => Trip.triggerDynamic());
    document.getElementById('trip-comedown').addEventListener('click', () => Trip.comeDown());

    // Toggle panel — click the header or press T (when not focused in an input).
    let tripPanelOpen = false;

    function setTripPanel(open) {
        tripPanelOpen = open;
        tripBody.style.display = open ? 'block' : 'none';
        tripToggleBtn.textContent = (open ? '▼' : '▶') + ' Trip (T)';
    }

    tripToggleBtn.addEventListener('click', () => setTripPanel(!tripPanelOpen));
    window.addEventListener('keydown', (e) => {
        if (e.code === 'KeyT' && !e.target.matches('input, textarea, select, button')) {
            e.preventDefault();
            setTripPanel(!tripPanelOpen);
        }
    });

    // Render loop
    const clock = new THREE.Clock();
    // Fake "Zerble" position for Trip.update — sandbox has no driver, so we
    // pass a stationary point at origin and zero speed. wookPositions stays
    // empty so the proximity-trigger path never fires; only the FIRE /
    // DYNAMIC panel buttons can start a trip.
    const _tripPos = new THREE.Vector3();
    const _audioForward = new THREE.Vector3();
    let nextStatsUpdate = 0;

    function tick() {
        // Preview MCP runs the page document.hidden — RAF throttles to ~0 fps
        // when hidden. Fall back to setTimeout in that case so the sandbox
        // keeps ticking inside the preview (same pattern as main.js).
        if (document.hidden) setTimeout(tick, 16);
        else requestAnimationFrame(tick);
        const dt = Math.min(clock.getDelta(), 0.05);
        if(!holdTimeOfDay)tod.update(dt);
        // Drive the shared lake water material's night-shimmer uniforms.
        setLakeNightness(tod.nightness, performance.now() * 0.001);
        if (updateFn) updateFn(dt);
        if(soundInitialised && ['camp_jam','woodland_camping','campsite_activity','people_workshop'].includes(select.value)) {
            camera.getWorldDirection(_audioForward);
            Sound.updateAudioListener(camera.position.x,camera.position.y,camera.position.z,_audioForward.x,_audioForward.y,_audioForward.z);
        }
        Trip.update(dt, _tripPos, 0, []);
        // Feed trip progress into the MIDI player's effect chain so they warp
        // together — same wiring as main.js. Only auto-drive from a REAL
        // (panel-fired) trip: when the envelope is idle, leave setTripState /
        // setMusicTrip alone so the manual trip-sweep slider stays in control
        // instead of being clobbered every frame by an env=0 reset.
        if (Trip._envelope > 0) {
            if (midiPlayer && midiPlayer.isPlaying) {
                midiPlayer.setTripState(Trip._envelope, Trip.progress());
            }
            // Drive the procedural music bus's trip effects — same source of truth
            // as main.js, so the band/drum styles selected from the sandbox Music
            // panel will warp during FIRE/DYNAMIC trips just like in the game.
            Sound.setMusicTrip(Trip._envelope, Trip.progress());
        }
        // Refresh trip panel readouts only when visible (cheap when closed).
        if (tripPanelOpen) {
            tripStateEl.textContent =
                `state: ${Trip.state.padEnd(11)} env: ${Trip._envelope.toFixed(2)}  ${Trip.dynamic ? 'DYN' : 'stat'}`;
            // While Dynamic mode is driving a trip, mirror live values into the
            // sliders so you can see the scripted timeline animating.
            if (Trip.dynamic && Trip.isActive() && Trip.live) {
                for (const [key, s] of Object.entries(tripSliders)) {
                    if (key in Trip.live) {
                        const v = Trip.live[key];
                        s.input.value = v;
                        s.readout.textContent = v.toFixed(2);
                    }
                }
            }
        }
        ContextLights.update(camera.position, scene);
        composer.render();
        const now = performance.now();
        if (now >= nextStatsUpdate) {
            renderStats.textContent = `scene: ${sceneInfo.calls} draws · ${sceneInfo.triangles.toLocaleString()} tris · ${renderer.info.memory.geometries} geo · ${renderer.info.memory.textures} tex`;
            nextStatsUpdate = now + 250;
        }
    }

    tick();
</script>
</body>
</html>
